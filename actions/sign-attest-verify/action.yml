name: sign-attest-verify
description: >-
  Sign a pushed image by digest (cosign keyless, GitHub OIDC), attach a signed SPDX SBOM
  attestation, verify both against the CALLER's release workflow identity, and print the pin.
  Runs inside the caller's job, so the certificate names the caller's workflow, not this repo.
  The job needs `id-token: write`. cosign and syft match mcp-factory-host's image gate.
inputs:
  ref:
    description: The pushed image by digest, e.g. ghcr.io/owner/name@sha256:...
    required: true
  version:
    description: The release version, for the printed pin.
    required: true
outputs:
  pin:
    description: name:version@digest -- the signed manifest.
    value: ${{ steps.verify.outputs.pin }}
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      with:
        cosign-release: v3.1.3   # the image gate's cosign

    - name: Sign the image by digest
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: cosign sign --yes "$REF"

    - name: SBOM (SPDX JSON) of the pushed image
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      with:
        image: ${{ inputs.ref }}
        syft-version: v1.54.1   # the image gate's syft
        format: spdx-json
        output-file: ${{ runner.temp }}/sbom.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Attest the SBOM
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"

    - id: verify
      name: Verify as a deploy will
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        VERSION: ${{ inputs.version }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        ISSUER: https://token.actions.githubusercontent.com
      run: |
        # owner/repo/.github/workflows/release.yml@refs/tags/vX.Y.Z -> identity regexp
        wf="${WORKFLOW_REF%@*}"
        ID="^https://github\.com/$(printf '%s' "$wf" | sed 's/[.]/\\./g')@refs/tags/v"
        cosign verify --certificate-identity-regexp "$ID" --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
        cosign verify-attestation --type spdxjson --certificate-identity-regexp "$ID" \
          --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
        # The tag resolves to an OCI index that wraps this manifest and is not signed,
        # so a pin taken from the tag fails verification. Pin this one.
        pin="${REF%@*}:$VERSION@${REF#*@}"
        echo "pin: $pin"
        echo "pin=$pin" >> "$GITHUB_OUTPUT"
        {
          echo "pin (the image manifest, signed and attested):"
          echo
          echo "\`$pin\`"
          echo
          echo "signature and SBOM attestation verified against \`$ID\`."
          echo "The tag \`$VERSION\` may resolve to an unsigned OCI index: pin the digest above, not the tag's."
        } >> "$GITHUB_STEP_SUMMARY"
